<form [formGroup]="boxeForm" (ngSubmit)="submitForm()">

  <!-- General Information Section -->
  <div class="card border-0 shadow-sm">
    <div class="card-body p-4">

      <!-- Section Header -->
      <div class="section-header d-flex align-items-center gap-3 mb-4">
        <div class="section-icon bg-primary bg-opacity-10 rounded d-flex align-items-center justify-content-center">
          <i class="fa fa-info-circle text-white"></i>
        </div>
        <div>
          <h6 class="mb-0 fw-semibold">Information General</h6>
          <small class="text-muted">Details de l'objet</small>
        </div>
      </div>

      <!-- Form Fields -->
      <div class="row g-3">

        <div class="col-12">
          <label class="form-label fw-medium">
            Nom
          </label>
          <input
            type="text"
            class="form-control"
            [class.is-invalid]="isFieldInvalid('nom')"
            formControlName="nom"
            placeholder="">
          <div class="invalid-feedback" *ngIf="isFieldInvalid('nom')">
            {{ getFieldError('nom') }}
          </div>
        </div>

        <div class="col-12">
          <label class="form-label fw-medium">
            Prenom <span class="text-danger">*</span>
          </label>
          <input
            type="text"
            class="form-control"
            [class.is-invalid]="isFieldInvalid('prenom')"
            formControlName="prenom"
            placeholder="">
          <div class="invalid-feedback" *ngIf="isFieldInvalid('prenom')">
            {{ getFieldError('prenom') }}
          </div>
        </div>

        <div class="col-12">
          <label class="form-label fw-medium">
            Sexe <span class="text-danger">*</span>
          </label>
          <div class="input-group">
            <select
              class="form-select"
              [class.is-invalid]="isFieldInvalid('sexe')"
              formControlName="sexe">
              <option value="" disabled>Selectionner</option>
              <option *ngFor="let item of listSexe" [value]="item.val">
                {{ item.label }}
              </option>
            </select>
            <div class="invalid-feedback" *ngIf="isFieldInvalid('sexe')">
              {{ getFieldError('sexe') }}
            </div>
          </div>
        </div>

        <div class="col-12">
          <label class="form-label fw-medium">
            Adresse
          </label>
          <input
            type="text"
            class="form-control"
            [class.is-invalid]="isFieldInvalid('adresse')"
            formControlName="adresse"
            placeholder="">
          <div class="invalid-feedback" *ngIf="isFieldInvalid('adresse')">
            {{ getFieldError('adresse') }}
          </div>
        </div>

        <div class="col-12">
          <label class="form-label fw-medium">
            Contact
          </label>
          <input
            type="text"
            class="form-control"
            [class.is-invalid]="isFieldInvalid('contact')"
            formControlName="contact"
            placeholder="">
          <div class="invalid-feedback" *ngIf="isFieldInvalid('contact')">
            {{ getFieldError('contact') }}
          </div>
        </div>

        <div class="col-12">
          <label class="form-label fw-medium">
            Date de naissance <span class="text-danger">*</span>
          </label>
          <input
            type="date"
            class="form-control"
            [class.is-invalid]="isFieldInvalid('date_naissance')"
            formControlName="date_naissance">
          <div class="invalid-feedback" *ngIf="isFieldInvalid('date_naissance')">
            {{ getFieldError('date_naissance') }}
          </div>
        </div>

      </div>

    </div>
    <div class="card-footer form-actions d-flex gap-2 justify-content-end">
      <button
        type="button"
        class="btn btn-outline-secondary"
        (click)="resetForm()">
        <i class="fa fa-times"></i>
        R&eacute;initialiser
      </button>
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="boxeForm.invalid">
        <i class="fa fa-check"></i>
        {{ isEditMode ? 'Modifier' : 'Enregistrer' }}
      </button>
    </div>
  </div>

</form>
