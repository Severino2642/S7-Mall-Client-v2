<!-- Header -->
<header class="header-component bg-white border-bottom sticky-top">
  <div class="container-fluid">
    <div class="row align-items-center py-2">
      <!-- Left section: Logo and Navigation -->
      <div class="col-md-8 col-lg-7">
        <div class="d-flex align-items-center gap-4">
          <!-- Logo -->
          <div class="d-flex align-items-center gap-2">
            <div class="logo-icon d-flex align-items-center justify-content-center">
              <span class="material-icons text-white">shopping_bag</span>
            </div>
            <span class="fs-5 fw-bold">OLYMPIA</span>
          </div>
          
          <!-- Navigation Menu -->
          <nav class="d-none d-md-flex align-items-center gap-3">
            <a *ngFor="let link of navigationLinks" 
               class="nav-link-custom" 
               [class.active]="link.active"
               (click)="navigateTo(link.route)" 
               href="javascript:void(0)">
              {{ link.label }}
            </a>
          </nav>
        </div>
      </div>
      
      <!-- Right section: Search, Notifications, Avatar -->
      <div class="col-md-4 col-lg-5">
        <div class="d-flex align-items-center justify-content-end gap-3">
          
          <!-- Notifications Button -->
          <button class="btn btn-light rounded-circle p-2 btn-icon" type="button">
            <span class="material-icons text-muted">notifications</span>
          </button>
          
          <!-- User Avatar with Dropdown -->
          <div class="position-relative">
            <div class="avatar-wrapper" (click)="toggleUserMenu()" style="cursor: pointer;">
              <img class="rounded-circle" [src]="userInfo.avatar" alt="User profile" width="32" height="32" />
            </div>
            
            <!-- User Dropdown Menu -->
            <div *ngIf="showUserMenu" class="user-dropdown">
              <div class="user-dropdown-header">
                <div class="d-flex align-items-center gap-2">
                  <img class="rounded-circle" [src]="userInfo.avatar" alt="User profile" width="40" height="40" />
                  <div>
                    <div class="fw-semibold">{{ userInfo.name }}</div>
                    <div class="small text-muted">{{ userInfo.email }}</div>
                  </div>
                </div>
              </div>
              <div class="dropdown-divider"></div>
              <button class="dropdown-item d-flex align-items-center gap-2" (click)="logout()">
                <span class="material-icons" style="font-size: 18px;">logout</span>
                <span>Déconnexion</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Overlay to close menu when clicking outside -->
<div *ngIf="showUserMenu" class="user-menu-overlay" (click)="closeUserMenu()"></div>
