<header class="main-header">

  <!-- Header Top (Barre principale) -->
  <div class="header-top w-100">
    <div class="container-fluid">
      <div class="header-top-content">

        <!-- Logo -->
        <div class="logo-section">
          <a href="/" class="logo-link">
            <img src="assets/logo.png" width="50">
            <span class="logo-text">OLYMPIA</span>
          </a>
        </div>

        <!-- Barre de recherche -->
        <div class="search-section">
          <form class="search-form" (submit)="onSearch(); $event.preventDefault()">
            <select class="search-category">
              <option value="all">Toutes</option>
              <option value="electronics">Électronique</option>
              <option value="fashion">Mode</option>
              <option value="home">Maison</option>
              <option value="books">Livres</option>
            </select>
            <input
              type="text"
              class="search-input"
              [(ngModel)]="searchQuery"
              placeholder="Rechercher des produits..."
              name="search">
            <button type="submit" class="search-button">
              <i class="fa fa-search"></i>
            </button>
          </form>
        </div>

        <!-- Actions utilisateur -->
        <div class="user-actions">

          <!-- Langue -->
          <div class="action-item language-selector">
            <button class="action-button">
              <img src="https://flagcdn.com/w20/fr.png" alt="FR" class="flag-icon">
              <span class="action-text">FR</span>
              <i class="fa fa-caret-down"></i>
            </button>
          </div>

          <!-- Compte & Listes -->
          <div class="action-item account-section">
            <button class="action-button" (click)="toggleUserMenu()">
              <span class="action-greeting">Bonjour, {{ userInfo.name }}</span>
              <span class="action-label">
                Compte & Listes
                <i class="fa fa-caret-down ms-1"></i>
              </span>
            </button>

            <div
              class="user-dropdown"
              *ngIf="showUserMenu"
              (click)="$event.stopPropagation()">
              <div class="list-group list-group-flush">
                <a
                  *ngFor="let menuItem of userMenuItems; let last = last"
                  href="javascript:void(0)"
                  class="list-group-item list-group-item-action d-flex align-items-center gap-3 py-2"
                  [class.border-bottom-0]="last"
                  (click)="handleUserMenuAction(menuItem.action)">
                  <!--          <span class="fs-5"><i class="{{ menuItem.icon }}"></i></span>-->
                  <span><i class="fa-solid {{menuItem.icon}}"></i> {{ menuItem.label }}</span>
                </a>
              </div>
            </div>
          </div>

          <!-- Commandes -->
          <div class="action-item">
            <button class="action-button" (click)="goToOrders()">
              <span class="action-greeting">Retours</span>
              <span class="action-label">& Commandes</span>
            </button>
          </div>

          <!-- Notifications -->
          <div class="action-item notification-section">
            <button
              class="action-button notification-button"
              (click)="toggleNotifications()">
              <i class="fa fa-bell"></i>
              <span class="notification-badge" *ngIf="getUnreadCount() > 0">
                {{ getUnreadCount() }}
              </span>
            </button>

            <!-- Dropdown Notifications -->
            <div
              class="notifications-dropdown"
              *ngIf="showNotifications"
              (click)="$event.stopPropagation()">

              <!-- Header -->
              <div class="notifications-header">
                <h6 class="mb-0">Notifications</h6>
                <button
                  class="btn-mark-all-read"
                  (click)="markAllAsRead()"
                  *ngIf="getUnreadCount() > 0">
                  Tout marquer comme lu
                </button>
              </div>

              <!-- Liste des notifications -->
              <div class="notifications-list">
                <div
                  *ngFor="let notification of notifications"
                  class="notification-item"
                  [class.unread]="!notification.lu"
                  (click)="markAsRead(notification)">

                  <!-- Icône selon le type -->
                  <div [innerHTML]="getSafeBadge(notification.badge||'')"></div>

                  <!-- Contenu -->
                  <div class="notification-content">
                    <div class="notification-title">{{ notification.title }}</div>
                    <div class="notification-message">{{ notification.message }}</div>
                    <div class="notification-time">{{ UtilitaireUtil.formatRelativeTime(notification.date||null) }}</div>
                  </div>

                  <!-- Indicateur non lu -->
                  <div class="notification-dot" *ngIf="!notification.lu"></div>

                  <!-- Bouton supprimer -->
                  <button
                    class="btn-delete-notification"
                    (click)="deleteNotification(notification._id||''); $event.stopPropagation()"
                    title="Supprimer">
                    <i class="fa fa-times"></i>
                  </button>
                </div>

                <!-- Empty state -->
                <div *ngIf="notifications.length === 0" class="notifications-empty">
                  <i class="fa fa-bell-slash fa-2x mb-2"></i>
                  <p>Aucune notification</p>
                </div>
              </div>

<!--              &lt;!&ndash; Footer &ndash;&gt;-->
<!--              <div class="notifications-footer">-->
<!--                <a href="/notifications" class="view-all-link">-->
<!--                  Voir toutes les notifications-->
<!--                </a>-->
<!--              </div>-->
            </div>
          </div>

          <!-- Panier -->
          <div class="action-item cart-section">
            <button class="action-button cart-button" (click)="goToCart()">
              <div class="cart-icon-wrapper">
                <i class="fa fa-shopping-cart"></i>
                <span class="cart-count" *ngIf="cartItemsCount > 0">
                  {{ cartItemsCount }}
                </span>
              </div>
              <span class="action-label">Panier</span>
            </button>
          </div>

        </div>

      </div>
    </div>
  </div>

  <!-- Header Bottom (Navigation) -->
  <div class="header-bottom">
    <div class="container-fluid">
      <div class="header-bottom-content">

        <!-- Menu hamburger -->
        <button class="menu-toggle" (click)="toggleMobileMenu()">
          <i class="fa fa-bars"></i>
          <span>Toutes</span>
        </button>

        <!-- Navigation links -->
        <nav class="main-nav">
          <a href="javascript:void(0)" (click)="navigateTo('client/market/produit')" class="nav-link">
            <i class="fa fa-box me-1"></i>
            Articles
          </a>
          <!-- <a href="/deals" class="nav-link">
            <i class="fa fa-map-location me-1"></i>
            Centre commerciaux
          </a>
          <a href="/registry" class="nav-link">
            <i class="fa fa-tags me-1"></i>
            Liste de souhaits
          </a> -->
        </nav>

      </div>
    </div>
  </div>

</header>

<!-- Overlay pour fermer les dropdowns -->
<div
  class="dropdown-overlay"
  *ngIf="showNotifications"
  (click)="closeNotifications()">
</div>
