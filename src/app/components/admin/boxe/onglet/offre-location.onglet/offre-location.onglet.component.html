<div class="card border-0 shadow-sm">
  <!-- Tableau -->
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="bg-light">
        <tr>
          <th class="border-0 text-muted text-uppercase" style="font-size: 0.7rem; font-weight: 600;">
            ID
          </th>
          <th class="border-0 text-muted text-uppercase" style="font-size: 0.7rem; font-weight: 600;">
            Montant Loyer
          </th>
          <th class="border-0 text-muted text-uppercase" style="font-size: 0.7rem; font-weight: 600;">
            Date
          </th>
          <th class="border-0 text-muted text-uppercase" style="font-size: 0.7rem; font-weight: 600;">
            Actions
          </th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let item of getPaginatedItems()">
          <td class="fw-semibold" style="color: #1A4A54;">
            <a [routerLink]="['/admin/offreLocation/details', item._id]">{{ item._id }}</a>
          </td>
          <td>
            {{ UtilitaireUtil.formatAmount(item.montantLoyer) }} <small class="text-muted">Ar</small>
          </td>
          <td class="text-muted">
            {{ item.date | date: 'dd/MM/yyyy' }}
          </td>
          <td>
            <div class="d-flex gap-2">
              <button
                class="btn btn-sm btn-link text-muted p-1"
                (click)="editItem(item)"
                title="Modifier">
                <i class="fa fa-edit"></i>
              </button>
              <button
                class="btn btn-sm btn-link text-danger p-1"
                (click)="deleteItem(item)"
                title="Supprimer">
                <i class="fa fa-trash"></i>
              </button>
            </div>
          </td>
        </tr>

        <tr *ngIf="getPaginatedItems().length === 0">
          <td colspan="6" class="text-center text-muted py-4">
            <i class="fa fa-inbox fa-2x mb-2"></i>
            <div>Aucune element trouvée</div>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Pagination -->
  <div class="pagination-box card-footer border-top d-flex justify-content-between align-items-center">
    <div class="text-muted" style="font-size: 0.875rem;">
      Affichage de {{ getPaginatedItems().length }} sur {{ items.length }} résultats
    </div>

    <nav>
      <ul class="pagination pagination-sm mb-0">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <a
            class="page-link"
            href="javascript:void(0)"
            (click)="previousPage()">
            <i class="fa fa-chevron-left"></i>
          </a>
        </li>

        <li
          class="page-item"
          *ngFor="let page of [].constructor(totalPages); let i = index"
          [class.active]="currentPage === i + 1">
          <a
            class="page-link"
            href="javascript:void(0)"
            (click)="goToPage(i + 1)">
            {{ i + 1 }}
          </a>
        </li>

        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <a
            class="page-link"
            href="javascript:void(0)"
            (click)="nextPage()">
            <i class="fa fa-chevron-right"></i>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</div>
