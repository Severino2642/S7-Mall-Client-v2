<div class="flex h-screen" style="background-color: #f5f5f5;">
  <!-- Sidebar à gauche -->
  <app-navbar></app-navbar>

  <!-- Contenu principal -->
  <main class="flex-1 overflow-y-auto">
    <app-header></app-header>
    <div class="main-page">
      <div>
        <h4 class="text-3xl font-bold" style="color: #101828;">{{getTitre()}}</h4>
      </div>
      <div class="boxe-form-container">
        <form [formGroup]="boxeForm" (ngSubmit)="submitForm()">

          <!-- General Information Section -->
          <div class="card border-0 shadow-sm">
            <div class="card-body p-4">

              <!-- Section Header -->
              <div class="section-header d-flex align-items-center gap-3 mb-4">
                <div class="section-icon bg-primary bg-opacity-10 rounded d-flex align-items-center justify-content-center">
                  <i class="fa fa-info-circle text-white"></i>
                </div>
                <div>
                  <h6 class="mb-0 fw-semibold">Information General</h6>
                  <small class="text-muted">Details de l'objet</small>
                </div>
              </div>

              <!-- Form Fields -->
              <div class="row g-3">

                <!-- Nom du Boxe -->
                <div class="col-12 col-md-3">
                  <label class="form-label fw-medium">
                    Nom du Boxe <span class="text-danger">*</span>
                  </label>
                  <input
                    type="text"
                    class="form-control"
                    [class.is-invalid]="isFieldInvalid('nom')"
                    formControlName="nom"
                    placeholder="e.g. Ergonomic Office Chair V2">
                  <div class="invalid-feedback" *ngIf="isFieldInvalid('nom')">
                    {{ getFieldError('nom') }}
                  </div>
                </div>

                <div class="col-12 col-md-3">
                  <!-- Description (comme Category) -->
                  <label class="form-label fw-medium">
                    Description
                  </label>
                  <input
                    type="text"
                    class="form-control"
                    formControlName="description"
                    placeholder="Description du boxe">
                </div>

                <div class="col-12 col-md-3">
                  <label class="form-label fw-medium">
                    Longueur <small>(en m)</small> <span class="text-danger">*</span>
                  </label>
                  <input
                    type="number"
                    class="form-control"
                    [class.is-invalid]="isFieldInvalid('longueur')"
                    formControlName="longueur"
                    placeholder="0">
                  <div class="invalid-feedback" *ngIf="isFieldInvalid('longueur')">
                    {{ getFieldError('longueur') }}
                  </div>
                </div>

                <div class="col-12 col-md-3">
                  <label class="form-label fw-medium">
                    Largeur <small>(en m)</small>  <span class="text-danger">*</span>
                  </label>
                  <input
                    type="text"
                    class="form-control"
                    [class.is-invalid]="isFieldInvalid('largeur')"
                    formControlName="largeur"
                    placeholder="0">
                  <div class="invalid-feedback" *ngIf="isFieldInvalid('largeur')">
                    {{ getFieldError('largeur') }}
                  </div>
                </div>
              </div>

            </div>
            <div class="card-footer form-actions d-flex gap-2 justify-content-end">
              <button
                type="button"
                class="btn btn-outline-secondary"
                (click)="resetForm()">
                <i class="fa fa-times"></i>
                R&eacute;initialiser
              </button>
              <button
                type="submit"
                class="btn btn-primary"
                [disabled]="boxeForm.invalid">
                <i class="fa fa-check"></i>
                {{ isEditMode ? 'Modifier' : 'Enregistrer' }}
              </button>
            </div>
          </div>

        </form>
      </div>
    </div>
  </main>

</div>
