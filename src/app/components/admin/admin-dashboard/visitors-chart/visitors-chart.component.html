<div class="row g-4 mb-4">
  <div class="col-12 col-lg-8">
    <div class="chart-card">
      <div class="chart-header">
        <div>
          <h3 class="chart-title">
            <i class="fa fa-calendar-alt me-2"></i>
            Activité des Visiteurs
          </h3>
          <p class="chart-subtitle">{{getSubtitle()}}</p>
        </div>
        <div class="d-flex align-items-center gap-2">
          <div class="d-flex align-items-center gap-1">
            <button class="btn btn-light btn-sm" (click)="previousDate()">
              <i class="fa fa-chevron-left"></i>
            </button>
            <button class="btn btn-light btn-sm" (click)="nextDate()">
              <i class="fa fa-chevron-right"></i>
            </button>
          </div>
          <select class="form-select form-select-sm" [(ngModel)]="choixAffichage" (change)="changeAffichage()">
            <option *ngFor="let item of listChoixAffichage" value="{{item}}">
              {{item}}
            </option>
          </select>
        </div>
      </div>
      <div class="chart-body">
        <div class="chart-container w-100 h-100">
          <canvas #myChart></canvas>
        </div>
      </div>
    </div>
  </div>
  <div class="col-12 col-lg-4">
    <div class="chart-card">
      <div class="chart-header">
        <div>
          <h3 class="chart-title">
            <i class="fa fa-chart-area me-2"></i>
            Répartition des Visiteurs
          </h3>
          <p class="chart-subtitle">Par boutique</p>
        </div>
      </div>
      <div class="chart-body">
        <div class="chart-wrapper">
          <canvas #radarChartCanvas></canvas>
        </div>
      </div>
    </div>
  </div>
</div>
