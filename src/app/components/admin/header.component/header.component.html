<header class="app-header">
  <div class="container-fluid">
    <div class="header-content d-flex align-items-center justify-content-between">

      <!-- Left Side: Hamburger + Breadcrumb -->
      <!-- <div class="header-left d-flex align-items-center gap-3"> -->
        <!-- Menu Toggle Button (Mobile) -->
       <!-- <button class="btn btn-link text-dark p-0 d-lg-none" type="button">
         <i class="fa fa-home"></i>
       </button> -->

        <!-- Breadcrumb Navigation -->
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-0">
            <li
              *ngFor="let crumb of breadcrumbs; let last = last"
              class="breadcrumb-item"
              [class.active]="last">
              <a
                *ngIf="!last && crumb.link"
                href="javascript:void(0)"
                (click)="navigateTo(crumb.link)"
                class="text-decoration-none text-muted">
                {{ crumb.label }}
              </a>
              <span *ngIf="last || !crumb.link" class="text-dark fw-medium">
                {{ crumb.label }}
              </span>
            </li>
          </ol>
        </nav>
      <!-- </div> -->

      <!-- Right Side: Search + Icons -->
      <div class="header-right d-flex align-items-center gap-3">

        <!-- Search Bar -->
        <div class="search-wrapper position-relative">
          <div class="input-group search-input-group">
            <span class="input-group-text bg-transparent border-end-0">
              <i class="fa fa-search text-muted"></i>
            </span>
            <input
              type="text"
              class="form-control search-input border-start-0 ps-0"
              placeholder="Search"
              [(ngModel)]="searchQuery"
              (keyup.enter)="onSearch()">
            <span class="input-group-text bg-transparent border-start-0">
              <kbd class="search-shortcut">⌘F</kbd>
            </span>
          </div>
        </div>

        <!-- Divider -->
        <div class="header-divider d-none d-md-block"></div>

        <!-- Fullscreen Toggle -->
        <button
          class="btn btn-link icon-button p-0"
          type="button"
          title="Plein écran">
          <i class="fa fa-expand text-muted"></i>
        </button>

        <!-- Notifications -->
        <div class="position-relative notification-wrapper">
          <button
            class="btn btn-link icon-button p-0 position-relative border"
            type="button"
            (click)="toggleNotifications()"
            title="Notifications">
            <i class="fa fa-bell text-muted"></i>
            <span
              *ngIf="getUnreadCount() > 0"
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger notification-badge">
              {{ getUnreadCount() }}
            </span>
          </button>

          <!-- Notifications Dropdown -->
          <div
            class="notifications-dropdown"
            *ngIf="showNotifications"
            (click)="$event.stopPropagation()">

            <!-- Header -->
            <div class="notifications-header">
              <h6 class="mb-0">Notifications</h6>
              <button
                class="btn-mark-all-read"
                (click)="markAllAsRead()"
                *ngIf="getUnreadCount() > 0">
                Tout marquer comme lu
              </button>
            </div>

            <!-- Liste des notifications -->
            <div class="notifications-list">
              <div
                *ngFor="let notification of notifications"
                class="notification-item"
                [class.unread]="!notification.lu"
                (click)="markAsRead(notification)">

                <!-- Icône selon le type -->
                <div [innerHTML]="getSafeBadge(notification.badge||'')"></div>

                <!-- Contenu -->
                <div class="notification-content">
                  <div class="notification-title">{{ notification.title }}</div>
                  <div class="notification-message">{{ notification.message }}</div>
                  <div class="notification-time">{{ UtilitaireUtil.formatRelativeTime(notification.date||null) }}</div>
                </div>

                <!-- Indicateur non lu -->
                <div class="notification-dot" *ngIf="!notification.lu"></div>

                <!-- Bouton supprimer -->
                <button
                  class="btn-delete-notification"
                  (click)="deleteNotification(''); $event.stopPropagation()"
                  title="Supprimer">
                  <i class="fa fa-times"></i>
                </button>
              </div>

              <!-- Empty state -->
              <div *ngIf="notifications.length === 0" class="notifications-empty">
                <i class="fa fa-bell-slash fa-2x mb-2"></i>
                <p>Aucune notification</p>
              </div>
            </div>

            <!--              &lt;!&ndash; Footer &ndash;&gt;-->
            <!--              <div class="notifications-footer">-->
            <!--                <a href="/notifications" class="view-all-link">-->
            <!--                  Voir toutes les notifications-->
            <!--                </a>-->
            <!--              </div>-->
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Overlay pour fermer les notifications -->
<div
  class="notifications-overlay"
  *ngIf="showNotifications"
  (click)="closeNotifications()">
</div>
