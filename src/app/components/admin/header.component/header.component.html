<header class="app-header">
  <div class="container-fluid">
    <div class="header-content d-flex align-items-center justify-content-between">

      <!-- Left Side: Hamburger + Breadcrumb -->
      <div class="header-left d-flex align-items-center gap-3">
        <!-- Menu Toggle Button (Mobile) -->
<!--        <button class="btn btn-link text-dark p-0 d-lg-none" type="button">-->
<!--          <i class="fa fa-home"></i>-->
<!--        </button>-->

        <!-- Breadcrumb Navigation -->
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-0">
            <li
              *ngFor="let crumb of breadcrumbs; let last = last"
              class="breadcrumb-item"
              [class.active]="last">
              <a
                *ngIf="!last && crumb.link"
                href="javascript:void(0)"
                (click)="navigateTo(crumb.link)"
                class="text-decoration-none text-muted">
                {{ crumb.label }}
              </a>
              <span *ngIf="last || !crumb.link" class="text-dark fw-medium">
                {{ crumb.label }}
              </span>
            </li>
          </ol>
        </nav>
      </div>

      <!-- Right Side: Search + Icons -->
      <div class="header-right d-flex align-items-center gap-3">

        <!-- Search Bar -->
        <div class="search-wrapper position-relative">
          <div class="input-group search-input-group">
            <span class="input-group-text bg-transparent border-end-0">
              <i class="fa fa-search text-muted"></i>
            </span>
            <input
              type="text"
              class="form-control search-input border-start-0 ps-0"
              placeholder="Search"
              [(ngModel)]="searchQuery"
              (keyup.enter)="onSearch()">
            <span class="input-group-text bg-transparent border-start-0">
              <kbd class="search-shortcut">⌘F</kbd>
            </span>
          </div>
        </div>

        <!-- Divider -->
        <div class="header-divider d-none d-md-block"></div>

        <!-- Fullscreen Toggle -->
        <button
          class="btn btn-link icon-button p-0"
          type="button"
          title="Plein écran">
          <i class="fa fa-expand text-muted"></i>
        </button>

        <!-- Notifications -->
        <div class="position-relative notification-wrapper">
          <button
            class="btn btn-link icon-button p-0 position-relative border"
            type="button"
            (click)="toggleNotifications()"
            title="Notifications">
            <i class="fa fa-bell text-muted"></i>
            <span
              *ngIf="unreadCount > 0"
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger notification-badge">
              {{ unreadCount }}
            </span>
          </button>

          <!-- Notifications Dropdown -->
          <div
            class="notifications-dropdown card border-0 shadow-lg"
            [class.show]="showNotifications"
            *ngIf="showNotifications">

            <!-- Header -->
            <div class="notifications-header d-flex align-items-center justify-content-between p-3 border-bottom">
              <h6 class="mb-0 fw-semibold">Notifications</h6>
              <button
                class="btn btn-link btn-sm text-primary p-0"
                (click)="markAllAsRead()">
                Tout marquer comme lu
              </button>
            </div>

            <!-- List -->
            <div class="notifications-list">
              <div
                *ngFor="let notification of notifications"
                class="notification-item d-flex gap-3 p-3 border-bottom"
                [class.unread]="!notification.read"
                (click)="markAsRead(notification)">

                <!-- Icon -->
                <div class="notification-icon rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
                     [ngClass]="'notification-icon-' + notification.type">
                  <i class="fa"
                     [ngClass]="{
                       'fa-info-circle': notification.type === 'info',
                       'fa-exclamation-triangle': notification.type === 'warning',
                       'fa-check-circle': notification.type === 'success',
                       'fa-times-circle': notification.type === 'danger'
                     }"></i>
                </div>

                <!-- Content -->
                <div class="notification-content flex-grow-1">
                  <div class="d-flex justify-content-between align-items-start mb-1">
                    <h6 class="notification-title mb-0">{{ notification.title }}</h6>
                    <button
                      class="btn btn-link btn-sm p-0 text-muted"
                      (click)="deleteNotification(notification); $event.stopPropagation()"
                      title="Supprimer">
                      <i class="fa fa-times"></i>
                    </button>
                  </div>
                  <p class="notification-message text-muted mb-1">{{ notification.message }}</p>
                  <small class="notification-time text-muted">{{ notification.time }}</small>
                </div>

                <!-- Unread indicator -->
                <div *ngIf="!notification.read" class="unread-dot rounded-circle bg-primary"></div>
              </div>

              <!-- Empty State -->
              <div
                *ngIf="notifications.length === 0"
                class="text-center py-5 text-muted">
                <i class="fa fa-bell-slash fa-2x mb-3 d-block opacity-25"></i>
                <p class="mb-0">Aucune notification</p>
              </div>
            </div>

            <!-- Footer -->
            <div class="notifications-footer p-3 border-top text-center">
              <a href="javascript:void(0)" class="text-primary text-decoration-none fw-medium">
                Voir toutes les notifications
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Overlay pour fermer les notifications -->
<div
  class="notifications-overlay"
  *ngIf="showNotifications"
  (click)="closeNotifications()">
</div>
